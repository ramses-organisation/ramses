name: on PR

# Controls when the workflow will run
on: [pull_request]

concurrency:
  group: ci-${{github.ref}}-${{github.event.pull_request.number || github.run_number}}
  cancel-in-progress: true

jobs:
  build:
    name: Build Ramses
    uses: ./.github/workflows/build.yaml

  tests:
    name: Test Ramses
    uses: ./.github/workflows/tests.yaml
